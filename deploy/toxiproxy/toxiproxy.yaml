apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: sre-lab
  labels: { app.kubernetes.io/name: toxiproxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: toxiproxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: toxiproxy }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.12.0
          args: ["-host=0.0.0.0"]
          ports:
            - { name: api, containerPort: 8474 }
            - { name: postgres, containerPort: 15432 }
            - { name: redis, containerPort: 16379 }
          readinessProbe: { httpGet: { path: /version, port: api } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: sre-lab
spec:
  selector: { app.kubernetes.io/name: toxiproxy }
  ports:
    - { name: api, port: 8474, targetPort: api }
    - { name: postgres, port: 15432, targetPort: postgres }
    - { name: redis, port: 16379, targetPort: redis }
