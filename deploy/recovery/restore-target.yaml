apiVersion: v1
kind: Service
metadata:
  name: postgres-restore
  namespace: sre-lab
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres-restore }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-restore
  namespace: sre-lab
  labels: { app.kubernetes.io/name: postgres-restore }
spec:
  serviceName: postgres-restore
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres-restore }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-restore }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: initialize-volume-owner
          image: sre-lab/postgres:17.6
          command: ["sh", "-c", "chown 70:70 /var/lib/postgresql/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN"] }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      containers:
        - name: postgres
          image: sre-lab/postgres:17.6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: POSTGRES_DB, value: reliability_restore }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: sre-lab-database, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sre-lab-database, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d reliability_restore"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: tmp, mountPath: /tmp }
      volumes: [{ name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
