{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "sre-lab.labels" $ | nindent 4 }}
spec:
  type: {{ default "ClusterIP" $component.serviceType }}
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
      {{- if $component.nodePort }}
      nodePort: {{ $component.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "sre-lab.labels" $ | nindent 4 }}
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: sre-reliability-lab
        sre-lab/chaos-target: "true"
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        {{- include "sre-lab.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ $.Values.image.repositoryPrefix }}/{{ $name }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "sre-lab.containerSecurityContext" $ | nindent 12 }}
          env:
            - { name: PORT, value: {{ $component.port | quote }} }
            - { name: OTEL_SERVICE_NAME, value: {{ $name | quote }} }
            - { name: SERVICE_VERSION, value: {{ $.Values.serviceVersion | quote }} }
            - { name: DEPLOYMENT_ENVIRONMENT, value: {{ $.Values.deploymentEnvironment | quote }} }
            {{- if $.Values.otelEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $.Values.otelEndpoint | quote }} }
            {{- end }}
            {{- if or (eq $name "catalog") (eq $name "orders") (eq $name "worker") }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: sre-lab-database, key: database-url } }
            {{- end }}
            {{- range $key, $value := $component.env }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
            {{- end }}
          ports: [{ name: http, containerPort: {{ $component.port }} }]
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources: {{- toYaml $component.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
