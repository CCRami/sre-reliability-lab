apiVersion: v1
kind: Secret
metadata:
  name: sre-lab-database
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sre-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database-url: {{ printf "postgres://%s:%s@postgres:5432/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.database | quote }}
