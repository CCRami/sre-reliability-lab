apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: {{ .Release.Namespace }}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      postgresql:
        endpoint: postgres.sre-lab.svc:5432
        transport: tcp
        username: ${env:POSTGRES_USERNAME}
        password: ${env:POSTGRES_PASSWORD}
        databases: [reliability_lab]
        collection_interval: 15s
        tls: { insecure: true }
      redis:
        endpoint: redis.sre-lab.svc:6379
        collection_interval: 15s
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name]
      resource:
        attributes:
          - { key: k8s.cluster.name, value: sre-reliability-lab, action: upsert }
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion: { enabled: true }
      otlp/tempo:
        endpoint: observability-tempo:4317
        tls: { insecure: true }
      otlphttp/loki:
        endpoint: http://observability-loki:3100/otlp
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp, postgresql, redis]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/loki]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: {{ .Release.Namespace }}
data:
  collector.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/observability_*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.container.name, k8s.node.name, k8s.deployment.name]
      resource:
        attributes:
          - { key: k8s.cluster.name, value: sre-reliability-lab, action: upsert }
      batch: {}
    exporters:
      otlp:
        endpoint: otel-gateway:4317
        tls: { insecure: true }
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp]
