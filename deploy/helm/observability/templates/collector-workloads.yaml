apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: otel-gateway }
spec:
  selector: { app.kubernetes.io/name: otel-gateway }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: prometheus, port: 8889, targetPort: prometheus }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-gateway }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          args: ["--config=/conf/collector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: POSTGRES_USERNAME
              valueFrom: { secretKeyRef: { name: sre-lab-database-copy, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sre-lab-database-copy, key: password } }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prometheus, containerPort: 8889 }
          readinessProbe: { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: config, mountPath: /conf, readOnly: true }]
      volumes: [{ name: config, configMap: { name: otel-gateway-config } }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: otel-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-agent }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsUser: 0
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          args: ["--config=/conf/collector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /conf, readOnly: true }
            - { name: podlogs, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - { name: config, configMap: { name: otel-agent-config } }
        - { name: podlogs, hostPath: { path: /var/log/pods } }
