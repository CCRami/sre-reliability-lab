              max(slo:sli_error:ratio_rate1d{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (3 * 0.01)) without (sloth_window)
          )
          or
          (
              max(slo:sli_error:ratio_rate6h{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (1 * 0.01)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate3d{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (1 * 0.01)) without (sloth_window)
          )
        labels:
          category: symptom
          severity: ticket
          sloth_severity: ticket
        annotations:
          impact: Accepted orders are not being fulfilled within 30 seconds.
          runbook_url: https://github.com/CCRami/sre-reliability-lab/blob/main/runbooks/fulfillment-delay.md
          summary: Fulfillment freshness is consuming error budget
          title: (ticket) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
            burn rate is too fast.
