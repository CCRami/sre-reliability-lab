  - name: sloth-slo-alerts-order-journey-fulfillment-freshness
    rules:
      - alert: FulfillmentFreshnessBurn
        expr: |
          (
              max(slo:sli_error:ratio_rate5m{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (14.4 * 0.01)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate1h{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (14.4 * 0.01)) without (sloth_window)
          )
          or
          (
              max(slo:sli_error:ratio_rate30m{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (6 * 0.01)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate6h{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (6 * 0.01)) without (sloth_window)
          )
        labels:
          category: symptom
          severity: page
          sloth_severity: page
        annotations:
          impact: Accepted orders are not being fulfilled within 30 seconds.
          runbook_url: https://github.com/CCRami/sre-reliability-lab/blob/main/runbooks/fulfillment-delay.md
          summary: Fulfillment freshness is consuming error budget
          title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
            burn rate is too fast.
      - alert: FulfillmentFreshnessBurn
        expr: |
          (
              max(slo:sli_error:ratio_rate2h{sloth_id="order-journey-fulfillment-freshness", sloth_service="order-journey", sloth_slo="fulfillment-freshness"} > (3 * 0.01)) without (sloth_window)
