openapi: 3.1.0
info:
  title: SRE Reliability Lab API
  version: 0.1.0
paths:
  /health/live:
    get:
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      responses:
        "200": { description: Required dependencies are ready }
        "503": { description: A required dependency is unavailable }
  /api/products/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Product found }
        "404": { description: Product not found }
        "503": { description: Catalog unavailable }
  /api/orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId, quantity]
              properties:
                productId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "202": { description: Order accepted for asynchronous fulfillment }
        "400": { description: Invalid input }
        "404": { description: Product not found }
        "503": { description: Required dependency unavailable }
  /api/orders/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Current order state }
        "404": { description: Order not found }
