name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build containers
        run: docker compose build
      - name: Start application and run critical-journey smoke test
        run: |
          docker compose up -d --wait
          npm run smoke
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application
        if: always()
        run: docker compose down -v

  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render Helm chart
        run: make helm-validate
      - name: Validate SLO generation and Prometheus rules
        run: |
          chmod +x scripts/*.sh
          make slo-generate
          git diff --exit-code -- observability/prometheus/rules deploy/helm/observability/files/rules
          make promtool-test
      - name: Validate Grafana dashboard JSON
        run: find deploy/helm/observability/files/dashboards -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Prove chaos safety guards reject unsafe contexts
        run: make chaos-guards
      - name: Validate rendered Kubernetes resources
        run: |
          helm template sre-lab deploy/helm/sre-lab > /tmp/sre-lab.yaml
          helm template observability deploy/helm/observability --namespace observability >> /tmp/sre-lab.yaml
          cat deploy/toxiproxy/toxiproxy.yaml deploy/recovery/restore-target.yaml >> /tmp/sre-lab.yaml
          cat chaos/experiments/*.yaml >> /tmp/sre-lab.yaml
          docker run --rm -v /tmp:/work ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /work/sre-lab.yaml
